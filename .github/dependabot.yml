# Keeps the GitHub Actions, the Node base image and the development dependencies (Playwright, ESLint) up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The image stays on the current Node LTS. Moving to the next one means changing .nvmrc and package.json with it,
    # which CI checks, so major versions aren't proposed here.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
