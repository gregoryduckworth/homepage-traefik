<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Routes</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <!-- A script in the head runs before first paint, so dark-mode users don't see a flash of the light theme. -->
  <script src="theme.js"></script>
</head>
<body>
  <header class="bar">
    <div class="bar-title">
      <h1 id="title">Routes</h1>
      <p class="summary" id="summary" aria-live="polite">Looking up routes…</p>
    </div>
    <div class="bar-tools">
      <label class="search">
        <span class="visually-hidden">Search routes</span>
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
        <input id="filter" type="search" placeholder="Search routes" title="Search routes (press /)" aria-keyshortcuts="/" autocomplete="off" spellcheck="false">
      </label>
      <button class="tool-button" id="new-group" type="button">
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
        New group
      </button>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/></svg>
        <svg class="icon-moon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
      </button>
    </div>
    <div class="strip" id="strip" role="img" hidden></div>
  </header>

  <main>
    <div class="notice" id="notice" role="alert" hidden></div>
    <div id="routes"></div>
    <div class="ungroup-zone" id="ungroup-zone" hidden>Drop here to take it out of its group</div>
    <p class="empty" id="empty" hidden></p>
    <button type="button" class="button-quiet hidden-toggle" id="hidden-toggle" hidden></button>
  </main>

  <footer class="footer" id="footer" hidden>
    homepage-traefik <a id="version" target="_blank" rel="noopener noreferrer"></a>
  </footer>

  <dialog class="details" id="details" aria-labelledby="details-title">
    <header class="details-head">
      <span class="dot" id="details-dot"></span>
      <h2 id="details-title"></h2>
      <form method="dialog">
        <button class="details-close" aria-label="Close">
          <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        </button>
      </form>
    </header>
    <div class="details-errors" id="details-errors" hidden></div>
    <dl class="details-list" id="details-list"></dl>
    <label class="details-group">
      <span>Group</span>
      <select id="details-group"></select>
    </label>
    <button type="button" class="button-quiet details-edit" id="details-check">Check now</button>
    <p class="group-error details-check-error" id="details-check-error" role="alert" hidden></p>
    <button type="button" class="button-quiet details-edit" id="details-edit">Change name or icon</button>
    <button type="button" class="button-quiet details-edit" id="details-hide">Hide route</button>
    <a class="details-open" id="details-open" target="_blank" rel="noopener noreferrer" hidden></a>
  </dialog>

  <dialog class="details group-dialog" id="group-dialog" aria-labelledby="group-dialog-title">
    <form method="dialog" id="group-form">
      <h2 id="group-dialog-title">New group</h2>
      <label for="group-name">Name</label>
      <input id="group-name" maxlength="60" autocomplete="off" required>
      <p class="group-error" id="group-error" role="alert" hidden></p>
      <div class="group-actions">
        <button type="button" class="button-quiet" id="group-cancel">Cancel</button>
        <button type="submit" class="button-primary" id="group-submit">Create group</button>
      </div>
    </form>
  </dialog>

  <dialog class="details group-dialog" id="route-dialog" aria-labelledby="route-dialog-title">
    <form id="route-form" novalidate>
      <h2 id="route-dialog-title">Name and icon</h2>
      <label for="route-name">Name</label>
      <input id="route-name" maxlength="60" autocomplete="off">
      <label for="route-icon">Icon address</label>
      <input id="route-icon" type="url" maxlength="2048" autocomplete="off" spellcheck="false" aria-describedby="route-hint">
      <p class="field-hint" id="route-hint">The address of an image. Leave a field empty to use the router name, or the icon found on the site.</p>
      <p class="group-error" id="route-error" role="alert" hidden></p>
      <div class="group-actions">
        <button type="button" class="button-quiet" id="route-cancel">Cancel</button>
        <button type="submit" class="button-primary" id="route-submit">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
